<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}T-Pot Management{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body            { background-color: #0d1117; }
    .card           { background-color: #161b22; border-color: #30363d; }
    .navbar         { background-color: #161b22 !important; border-bottom: 1px solid #30363d; }
    .table          { --bs-table-bg: transparent; --bs-table-border-color: #30363d; }
    .badge-running  { background-color: #238636; }
    .badge-stopped  { background-color: #6e7681; }
    .badge-infra    { background-color: #1f6feb; }
    textarea.cfg    { font-family: monospace; font-size: 0.82rem; background-color: #0d1117;
                      color: #e6edf3; border-color: #30363d; }
    .nav-link.active { color: #fff !important; border-bottom: 2px solid #58a6ff; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container-fluid px-4">
    <span class="navbar-brand fw-bold text-white">T-Pot Management</span>
    <div class="navbar-nav ms-auto flex-row gap-3">
      <a class="nav-link {% block nav_dash %}{% endblock %}"
         href="{{ prefix }}/">Dashboard</a>
      <a class="nav-link {% block nav_bzb %}{% endblock %}"
         href="{{ prefix }}/beelzebub">Beelzebub</a>
      <a class="nav-link {% block nav_ollama %}{% endblock %}"
         href="{{ prefix }}/ollama">Ollama</a>
      <a class="nav-link {% block nav_redteam %}{% endblock %}"
         href="{{ prefix }}/redteam">Red Team</a>
      <a class="nav-link" href="/" target="_blank">T-Pot UI</a>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 pb-5">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
